<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #draft { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Входящие заявки</h1>
    <form>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="4" aria-describedby="status"></textarea>
      <button type="submit">Разобрать заявку</button>
    </form>
    <section aria-live="polite" aria-atomic="true" aria-label="Результат разбора">
      <p id="status"></p>
      <div id="result" hidden>
        <h2 id="topic"></h2>
        <h3>Черновик ответа</h3>
        <p id="draft"></p>
      </div>
    </section>
  </main>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Стоимость"],
      ["other", "Другой вопрос"],
    ]);
    let revision = 0;

    function clearResult() {
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
      status.textContent = "";
    }

    message.addEventListener("input", () => {
      revision++;
      clearResult();
      message.removeAttribute("aria-invalid");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submittedRevision = ++revision;
      const text = message.value.trim();
      clearResult();
      if (!text) {
        message.setAttribute("aria-invalid", "true");
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      status.textContent = "Подбираем тему и готовим черновик…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (submittedRevision !== revision) return;

        if (reply.status === 400 && data?.status === "invalid_input") {
          message.setAttribute("aria-invalid", "true");
          status.textContent = "Проверьте текст заявки и повторите разбор.";
          message.focus();
          return;
        }
        if (!reply.ok || data?.status !== "ready" || !topicLabels.has(data.topic) ||
            typeof data.draft !== "string" || !data.draft.trim()) {
          status.textContent = "Разберите заявку вручную и подготовьте ответ клиенту.";
          return;
        }

        status.textContent = "";
        topic.textContent = "Тема заявки: " + topicLabels.get(data.topic);
        draft.textContent = data.draft.trim();
        result.hidden = false;
      } catch {
        if (submittedRevision !== revision) return;
        status.textContent = "Не удалось получить черновик. Повторите запрос или разберите заявку вручную.";
      }
    });
  </script>
</body>
</html>
